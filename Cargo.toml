[package]
name = "etc-os-release"
version = "0.1.1"
edition = "2021"
rust-version = "1.88.0"
description = "Parse /etc/os-release file"
repository = "https://github.com/gifnksm/etc-os-release"
license = "MIT OR Apache-2.0"
keywords = []
categories = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-sync-rdme.rustdoc]
toolchain = "nightly"

[package.metadata.cargo-sync-rdme.badge]
style = "flat-square"

[package.metadata.cargo-sync-rdme.badge.badges]
maintenance = true
license = { link = "#license" }
crates-io = true
docs-rs = true
rust-version = true
github-actions = { workflows = "ci.yml" }
codecov = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, optional = true }
indexmap = "2.14.2"
thiserror = "2.0.21"
url = { version = "2.5.8", default-features = false, optional = true }

[badges]
maintenance = { status = "passively-maintained" }

[features]
default = []
date = ["dep:chrono"]
url = ["dep:url"]
